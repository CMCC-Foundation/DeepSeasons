name: deepseasons
channels:
  - conda-forge
  - pytorch
dependencies:
  - python>=3.10,<3.13
  - numpy
  - scipy
  - pandas
  - xarray
  - netcdf4
  - h5netcdf
  - dask
  - cf_xarray
  - matplotlib
  - cartopy
  - scikit-learn
